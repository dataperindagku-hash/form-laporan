<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pendataan Pelaku Usaha - Kota Baubau</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --identity-green: #2e7d32; }
    .bg-green { background-color: var(--identity-green); color: white; }
    .btn-green { background-color: var(--identity-green); color: white; }
    .btn-green:hover { background-color: #1b5e20; color: white; }
    .loading-spine { display: none; text-align: center; my: 20px; }
    #signature-pad { border: 2px dashed #ccc; border-radius: 5px; cursor: crosshair; background-color: #fafafa; }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5" style="max-width: 650px;">
    <div class="card shadow border-0 rounded-3">
      
      <div class="card-header bg-green text-center py-4 rounded-top-3">
        <h4 class="mb-1 fw-bold" id="formTitle">Portal Pendataan Terpadu</h4>
        <p class="mb-0 small opacity-75" id="formSubtitle">Memuat formulir...</p>
      </div>
      
      <div class="card-body p-4">
        <div id="loadingArea" class="my-4 text-center">
          <div class="spinner-border text-success" role="status"></div>
          <p class="mt-2 text-muted small">Menyelaraskan struktur database...</p>
        </div>

        <form id="dynamicForm" class="d-none" onsubmit="submitFormData(this); return false;">
          <div id="fieldsContainer"></div>
          
          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-green p-2.5 fw-bold" id="submitBtn">Kirim Laporan</button>
          </div>
        </form>
        
        <div id="alertBox" class="alert mt-4 d-none" role="alert"></div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION (Sesuaikan URL & Nama Modul)
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxoabOhILmnKHBElWFFGr3qIjmpRWVouvdGOW5YGEXke6Fnr0udZ5FCBVg4K0YhhGMZ/exec"; 
    const NAMA_MODUL = "komoditas"; // Sesuai nama tab/modul dinas di spreadsheet Anda

    let fieldsData = [];
    let isCanvasActive = false;
    let canvas, ctx, drawing = false;

    // Ambil data susunan form berdasarkan konfigurasi di sheet "form_fields"
    document.addEventListener("DOMContentLoaded", function() {
      const fetchUrl = `${API_URL}?action=getFields&nama_modul=${encodeURIComponent(NAMA_MODUL)}`;
      
      fetch(fetchUrl)
        .then(response => response.json())
        .then(data => {
          document.getElementById('loadingArea').classList.add('d-none');
          if (data.length === 0) {
            showAlert('Gagal memuat form. Periksa nama modul atau tab form_fields Anda.', 'danger');
            return;
          }
          fieldsData = data;
          renderFormFields(data);
        })
        .catch(err => {
          document.getElementById('loadingArea').classList.add('d-none');
          showAlert('Koneksi gagal: ' + err.message, 'danger');
        });
    });

    // Render HTML Input berdasarkan data 'jenis' dari server Anda
    function renderFormFields(fields) {
      document.getElementById('formTitle').innerText = `Formulir ${NAMA_MODUL.toUpperCase()}`;
      document.getElementById('formSubtitle').innerText = "Silakan isi data secara mandiri dengan valid";
      const container = document.getElementById('fieldsContainer');
      
      fields.forEach((field, index) => {
        const fieldWrapper = document.createElement('div');
        fieldWrapper.className = 'mb-3';
        
        // Buat Label
        const label = document.createElement('label');
        label.className = 'form-label fw-semibold text-secondary small';
        label.innerHTML = `${field.label.replace(/_/g, " ")}`;
        fieldWrapper.appendChild(label);

        const jenis = field.jenis.toLowerCase();

        // 1. INPUT DROPDOWN SELECT
        if (jenis === 'select' || jenis === 'pilihan') {
          const select = document.createElement('select');
          select.className = 'form-select';
          select.name = field.label; // Gunakan label asli sebagai key payload
          select.required = true;
          
          select.innerHTML = `<option value="">-- Pilih ${field.label} --</option>`;
          if (field.opsi) {
            field.opsi.split(',').forEach(opt => {
              select.innerHTML += `<option value="${opt.trim()}">${opt.trim()}</option>`;
            });
          }
          fieldWrapper.appendChild(select);

        // 2. TEXTAREA (Untuk Alamat / Catatan)
        } else if (jenis === 'textarea' || jenis === 'alamat') {
          const textarea = document.createElement('textarea');
          textarea.className = 'form-control';
          textarea.name = field.label;
          textarea.rows = 3;
          textarea.required = true;
          fieldWrapper.appendChild(textarea);

        // 3. INPUT FILE / FOTO / BUKTI
        } else if (jenis === 'file' || jenis === 'foto' || jenis === 'gambar') {
          const input = document.createElement('input');
          input.className = 'form-control';
          input.type = 'file';
          input.name = field.label;
          input.accept = 'image/*';
          input.required = true;
          fieldWrapper.appendChild(input);

        // 4. KHUSUS TANDA TANGAN (Canvas Digital)
        } else if (jenis === 'ttd' || jenis === 'tanda_tangan' || field.label.toLowerCase().includes('ttd')) {
          isCanvasActive = true;
          fieldWrapper.innerHTML += `
            <div class="position-relative">
              <canvas id="signature-pad" width="550" height="200" class="w-100"></canvas>
              <button type="button" class="btn btn-sm btn-danger position-absolute bottom-0 end-0 m-2" onclick="clearCanvas()">Hapus</button>
            </div>
            <input type="hidden" id="hidden_ttd" name="${field.label}" required>`;
            
        // 5. INPUT STANDAR (Text, Number, Date, dll)
        } else {
          const input = document.createElement('input');
          input.className = 'form-control';
          input.type = (jenis === 'number' || jenis === 'angka') ? 'number' : (jenis === 'date' || jenis === 'tanggal') ? 'date' : 'text';
          input.name = field.label;
          input.required = true;
          fieldWrapper.appendChild(input);
        }

        container.appendChild(fieldWrapper);
      });

      document.getElementById('dynamicForm').classList.remove('d-none');
      if (isCanvasActive) initSignaturePad();
    }

    // Fungsi Konversi File Input ke Base64 (Dibutuhkan oleh Mesin Image Upload Anda)
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // Eksekusi Pengiriman Data Mengikuti Pola doPost Anda
    async function submitFormData(formElement) {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Mengirim data ke server...';
      
      const formData = new FormData(formElement);
      let payloadInside = {};

      // Jika ada Canvas TTD, kunci datanya ke input hidden
      if (isCanvasActive) {
        const hiddenTtd = document.getElementById('hidden_ttd');
        if (isCanvasBlank()) {
          showAlert('Tanda tangan wajib diisi!', 'danger');
          btn.disabled = false;
          btn.innerText = 'Kirim Laporan';
          return;
        }
        hiddenTtd.value = canvas.toDataURL("image/png");
      }

      // Olah seluruh field input ke dalam payloadObj
      for (const [key, value] of formData.entries()) {
        if (value instanceof File && value.name) {
          if(value.size > 0) {
            // Konversi file gambar menjadi String Base64 agar ditangkap oleh baris Anda
            payloadInside[key] = await getBase64(value); 
          } else {
            payloadInside[key] = "";
          }
        } else {
          payloadInside[key] = value;
        }
      }

      // Bungkus data sesuai struktur mutlak pembacaan doPost Anda 
      const finalPayloadToPost = {
        "nama_modul": NAMA_MODUL,
        "tanggal_input": new Date().toLocaleString('id-ID'),
        "payload": payloadInside
      };

      // Tembak menggunakan POST dengan header text/plain untuk menghindari batasan CORS Preflight
      fetch(API_URL, {
        method: "POST",
        mode: "no-cors", // Memotong masalah CORS bawaan redirect web app google script
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(finalPayloadToPost)
      })
      .then(() => {
        showAlert('Sukses! Data laporan berhasil dikirim ke pangkalan data.', 'success');
        formElement.reset();
        if(isCanvasActive) clearCanvas();
        btn.disabled = false;
        btn.innerText = 'Kirim Laporan';
      })
      .catch(err => {
        showAlert('Gagal mengirim data: ' + err.message, 'danger');
        btn.disabled = false;
        btn.innerText = 'Kirim Laporan';
      });
    }

    // Helper Notifikasi
    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.className = `alert mt-4 alert-${type}`;
      box.innerText = msg;
      box.classList.remove('d-none');
    }

    // ==========================================
    // LOGIKA OPERASIONAL CANVAS TANDA TANGAN
    // ==========================================
    function initSignaturePad() {
      canvas = document.getElementById('signature-pad');
      ctx = canvas.getContext('2d');
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#000000";

      // Mouse Events
      canvas.addEventListener("mousedown", (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
      canvas.addEventListener("mousemove", (e) => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } });
      canvas.addEventListener("mouseup", () => drawing = false);
      
      // Touch Events (Untuk HP / Smartphone)
      canvas.addEventListener("touchstart", (e) => {
        drawing = true; ctx.beginPath();
        var touch = e.touches[0];
        var rect = canvas.getBoundingClientRect();
        ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
        e.preventDefault();
      });
      canvas.addEventListener("touchmove", (e) => {
        if (!drawing) return;
        var touch = e.touches[0];
        var rect = canvas.getBoundingClientRect();
        ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        ctx.stroke();
        e.preventDefault();
      });
      canvas.addEventListener("touchend", () => drawing = false);
    }

    function clearCanvas() { if(canvas) { ctx.clearRect(0, 0, canvas.width, canvas.height); document.getElementById('hidden_ttd').value = ""; } }
    function isCanvasBlank() {
      const buffer = new Uint32Array(ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer);
      return !buffer.some(color => color !== 0);
    }
  </script>
</body>
</html>
