<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --identity-green: #2e7d32; }
    .bg-green { background-color: var(--identity-green); color: white; }
    .btn-green { background-color: var(--identity-green); color: white; }
    .btn-green:hover { background-color: #1b5e20; color: white; }
    .form-label { color: #333333; }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-3">
      
      <div class="card-header bg-green text-center py-4 rounded-top-3">
        <h4 class="mb-1 fw-bold">Portal Pendataan Pelaku Usaha</h4>
        <p class="mb-0 small opacity-75">Silakan isi data usaha Anda dengan benar</p>
      </div>
      
      <div class="card-body p-4">
        <form id="submissionForm" onsubmit="handleFormSubmit(this); return false;">
          
          <? for (var i = 0; i < fields.length; i++) { 
               var field = fields[i]; 
               var requiredAttr = field.required ? 'required' : '';
          ?>
            <div class="mb-3">
              <label class="form-label fw-semibold">
                <?= field.label ?> <? if(field.required){ ?><span class="text-danger">*</span><? } ?>
              </label>
              
              <? if (field.type === 'text' || field.type === 'number' || field.type === 'date') { ?>
                <input type="<?= field.type ?>" name="<?= field.name ?>" class="form-control" <?= requiredAttr ?>>
              
              <? } else if (field.type === 'textarea') { ?>
                <textarea name="<?= field.name ?>" class="form-control" rows="3" <?= requiredAttr ?>></textarea>
              
              <? } else if (field.type === 'select') { ?>
                <select name="<?= field.name ?>" class="form-select" <?= requiredAttr ?>>
                  <option value="">-- Pilih <?= field.label ?> --</option>
                  <? for (var j = 0; j < field.options.length; j++) { 
                       var opt = field.options[j].trim();
                  ?>
                    <option value="<?= opt ?>"><?= opt ?></option>
                  <? } ?>
                </select>
              
              <? } else if (field.type === 'file') { ?>
                <input type="file" name="<?= field.name ?>" class="form-control" <?= requiredAttr ?>>
              <? } ?>
            </div>
          <? } ?>
          
          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-green p-2.5 fw-bold" id="submitBtn">Kirim Data</button>
          </div>
        </form>
        
        <div id="alertBox" class="alert mt-4 d-none" role="alert"></div>
        
      </div>
    </div>
  </div>

  <script>
    function handleFormSubmit(formElement) {
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      
      // Mengunci tombol agar tidak tersubmit ganda
      btn.disabled = true;
      btn.innerText = 'Sedang Mengirim data...';
      alertBox.classList.add('d-none');

      // Mengirimkan formObject langsung ke Google Apps Script backend
      google.script.run
        .withSuccessHandler(function(response) {
          btn.disabled = false;
          btn.innerText = 'Kirim Data';
          
          alertBox.classList.remove('d-none', 'alert-danger', 'alert-success');
          
          if(response.success) {
            alertBox.classList.add('alert-success');
            alertBox.innerText = response.message;
            formElement.reset(); // Reset form jika berhasil
          } else {
            alertBox.classList.add('alert-danger');
            alertBox.innerText = 'Gagal: ' + response.message;
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'Kirim Data';
          alertBox.classList.remove('d-none', 'alert-success');
          alertBox.classList.add('alert-danger');
          alertBox.innerText = 'Terjadi kesalahan sistem: ' + err.message;
        })
        .submitFormData(formElement);
    }
  </script>
</body>
</html>
