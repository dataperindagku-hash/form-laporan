<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint PerindagKU Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loginPage" class="container">
        <h2>Login PerindagKU</h2>
        <form id="loginForm">
            <label for="nip">NIP:</label>
            <input type="text" id="nip" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" required>
            
            <button type="submit">Masuk</button>
        </form>
        <p id="loginMessage"></p>
    </div>

    <div id="dashboardPage" class="container" style="display: none;">
        <h2>Dashboard PerindagKU</h2>
        <div class="user-info">
            <p><strong>Nama:</strong> <span id="userNama"></span></p>
            <p><strong>NIP:</strong> <span id="userNip"></span></p>
            <p><strong>Hak Akses:</strong> <span id="userHakAkses"></span></p>
            
            <button id="btnLogout" class="btn-logout">Logout</button>
        </div>

        <hr>

        <h3>Form Laporan</h3>
        <form id="laporanForm">
            <label for="modul">Modul Dinas:</label>
            <select id="modul" required>
                <option value="">-- Pilih Modul --</option>
            </select>

            <label for="namaUsaha">Nama Usaha:</label>
            <input type="text" id="namaUsaha" required>

            <label for="keterangan">Keterangan:</label>
            <textarea id="keterangan" rows="4" required></textarea>

            <button type="submit">Kirim Laporan</button>
        </form>
        <p id="laporanMessage"></p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/login.js"></script>
    <script src="js/laporan.js"></script>
</body>
</html>
