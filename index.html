<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerindagKU Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loginPage" class="container">
        <div class="header-title">
            <h2>Login PerindagKU</h2>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="nip">NIP</label>
                <input type="text" id="nip" placeholder="Masukkan NIP Anda" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan Password" required>
            </div>
            
            <button type="submit" class="btn-primary">Masuk</button>
        </form>
        <p id="loginMessage" class="message"></p>
    </div>

    <div id="dashboardPage" class="container" style="display: none;">
        <div class="header-title">
            <h2>Dashboard PerindagKU</h2>
        </div>
        
        <div class="user-card">
            <p><strong>Nama:</strong> <span id="userNama">-</span></p>
            <p><strong>NIP:</strong> <span id="userNip">-</span></p>
            <p><strong>Hak Akses:</strong> <span id="userHakAkses">-</span></p>
            <button id="btnLogout" class="btn-danger">Logout</button>
        </div>

        <hr class="divider">

        <div class="form-section">
            <h3>Form Laporan</h3>
            <form id="laporanForm">
                <div class="form-group">
                    <label for="modul">Modul Dinas</label>
                    <select id="modul" required>
                        <option value="">-- Pilih Modul --</option>
                        </select>
                </div>

                <div class="form-group">
                    <label for="namaUsaha">Nama Usaha</label>
                    <input type="text" id="namaUsaha" placeholder="Contoh: Toko Maju Jaya" required>
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan</label>
                    <textarea id="keterangan" rows="4" placeholder="Tuliskan detail laporan..." required></textarea>
                </div>

                <button type="submit" class="btn-primary">Kirim Laporan</button>
            </form>
            <p id="laporanMessage" class="message"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/login.js"></script>
    <script src="js/laporan.js"></script>
</body>
</html>
