<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Laporan PerindagKU (Versi Web)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #F8FAFC; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1B5E20; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #334155; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #1B5E20; color: white; padding: 14px 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #144d18; }
        button:disabled { background-color: #94A3B8; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; text-align: center; font-size: 14px; padding: 10px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulir Laporan Lapangan</h2>
    
    <form id="laporanForm">
    <body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginPage">
        <h2>Login PerindagKU</h2>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>

        <button id="btnLogin">Masuk</button>

        <div id="loginStatus"></div>
    </div>


    <!-- FORM -->
    <div id="formPage" style="display:none">

        <h2>Formulir Laporan Lapangan</h2>

        <p>
            Login sebagai :
            <b id="namaUser"></b>
            <button id="logoutBtn" style="width:auto;padding:8px 15px;margin-left:15px">
                Logout
            </button>
        </p>

        <form id="laporanForm">

            <div class="form-group">
                <label>Nama Modul</label>
                <input type="text" id="nama_modul" required>
            </div>

            <div class="form-group">
                <label>Nama Usaha</label>
                <input type="text" id="nama_usaha" required>
            </div>

            <div class="form-group">
                <label>Keterangan</label>
                <textarea id="keterangan" rows="4"></textarea>
            </div>

            <button type="submit" id="btnSubmit">
                Kirim Laporan
            </button>

        </form>

        <div id="status"></div>

    </div>

</div>

<script>
    // URL Google Apps Script Anda (Sama dengan di Android)
    const BASE_URL = "https://script.google.com/macros/s/AKfycbxoabOhILmnKHBElWFFGr3qIjmpRWVouvdGOW5YGEXke6Fnr0udZ5FCBVg4K0YhhGMZ/exec";

    document.getElementById('laporanForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btnSubmit = document.getElementById('btnSubmit');
        const statusDiv = document.getElementById('status');
        
        btnSubmit.innerText = "Sedang Mengirim...";
        btnSubmit.disabled = true;
        
        statusDiv.style.display = "block";
        statusDiv.innerText = "Menghubungkan ke server...";
        statusDiv.style.backgroundColor = "#DBEAFE";
        statusDiv.style.color = "#1E40AF";

        // 1. BUAT FORMAT PAYLOAD (Kunci harus sama persis dengan Header/Kolom di Spreadsheet)
        const dataPayload = {
            "Nama Usaha": document.getElementById('nama_usaha').value,
            "Keterangan": document.getElementById('keterangan').value
        };

        // 2. DAPATKAN WAKTU SAAT INI (Format dd-MM-yyyy HH:mm:ss)
        const now = new Date();
        const waktuFormat = 
            now.getDate().toString().padStart(2, '0') + "-" + 
            (now.getMonth() + 1).toString().padStart(2, '0') + "-" + 
            now.getFullYear() + " " + 
            now.getHours().toString().padStart(2, '0') + ":" + 
            now.getMinutes().toString().padStart(2, '0') + ":" + 
            now.getSeconds().toString().padStart(2, '0');

        // 3. SUSUN DATA SESUAI PERMINTAAN API GOOGLE SCRIPT
        const requestData = {
            action: "insert_data",
            nama_modul: document.getElementById('nama_modul').value,
            tanggal_input: waktuFormat + " (Web Form)",
            data_payload: JSON.stringify(dataPayload)
        };

        // 4. KIRIM DATA KE SERVER
        fetch(BASE_URL, {
            method: "POST",
            // Menggunakan text/plain untuk mencegah masalah CORS (Cross-Origin) di browser
            headers: { "Content-Type": "text/plain;charset=utf-8" }, 
            body: JSON.stringify(requestData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "Sukses") {
                statusDiv.innerText = "✅ Data berhasil disimpan ke server!";
                statusDiv.style.backgroundColor = "#D1FAE5";
                statusDiv.style.color = "#065F46";
                document.getElementById('laporanForm').reset();
            } else {
                statusDiv.innerText = "❌ Gagal: " + (data.pesan || "Terjadi kesalahan sistem.");
                statusDiv.style.backgroundColor = "#FEE2E2";
                statusDiv.style.color = "#991B1B";
            }
        })
        .catch(error => {
            console.error(error);
            statusDiv.innerText = "❌ Gagal terhubung. Pastikan internet aktif atau cek URL Server.";
            statusDiv.style.backgroundColor = "#FEE2E2";
            statusDiv.style.color = "#991B1B";
        })
        .finally(() => {
            btnSubmit.innerText = "Kirim Laporan";
            btnSubmit.disabled = false;
        });
    });
</script>

</body>
</html>
